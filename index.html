<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayesha Rizwan | Portfolio</title>
    <!-- Font Awesome Icons for buttons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #0b1120;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #94a3b8;
            padding-bottom: 50px;
        }

        /* Top Header Section */
        header {
            text-align: center;
            padding: 60px 20px 10px 20px;
        }

        h1.main-title {
            font-size: 3.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 500;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 35px 0 45px 0;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #38bdf8;
        }

        /* Main Container & Layout */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Node Box Styling */
        .card-node {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .card-node h3 {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 18px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        /* Node Buttons */
        .btn-node {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s;
        }

        .btn-node:hover {
            transform: translateY(-2px);
        }

        .btn-red { background: #dc2626; color: white; }
        .btn-blue { background: #0284c7; color: white; }
        .btn-dark { background: #1e293b; color: white; border: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1 class="main-title">Ayesha Rizwan</h1>
        <p class="tagline">Data Science Student | Machine Learning Enthusiast</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#about">About</a>
        <a href="#skills">Technical Skills</a>
        <a href="#projects" class="active">Projects Portfolio</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main Section -->
    <div class="container">
        
        <!-- Left Sidebar Nodes -->
        <aside>
            
            <!-- Contact Node -->
            <div class="card-node">
                <h3>Contact Node</h3>
                <a href="mailto:ayesha@example.com" class="btn-node btn-red">
                    <i class="fa-solid fa-envelope"></i> Open Gmail
                </a>
                <a href="https://linkedin.com" target="_blank" class="btn-node btn-blue">
                    <i class="fa-brands fa-linkedin"></i> Visit LinkedIn
                </a>
                <a href="https://github.com/ayesha29-ch" target="_blank" class="btn-node btn-dark">
                    <i class="fa-brands fa-github"></i> Visit GitHub
                </a>
            </div>

            <!-- Academic Node -->
            <div class="card-node">
                <h3>Academic Node</h3>
                <h4 style="color: #ffffff; font-size: 1.05rem; margin-bottom: 6px;">Emerson University Multan</h4>
                <p style="color: #38bdf8; font-weight: 600; font-size: 0.95rem; margin-bottom: 6px;">BS Data Science</p>
                <p style="font-size: 0.88rem; color: #94a3b8;">Academic Standing: 6th Semester</p>
            </div>

        </aside>

        <!-- Right Side Main Section (Hum Next Step Mein Fill Karenge) -->
        <main>
            <!-- Content will be added here next -->
        </main>

    </div>

</body>
</html>
